# Vendored from the MantisNet research repo (crates/hexo-search, branch main).
# See vendor/engine/Cargo.toml for the renaming scheme.
[package]
name = "mantis-hexo-search"
description = "The evaluator seam and the nonblocking decision sessions (MantisNet lineage)."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "mantis_hexo_search"
path = "src/lib.rs"
doctest = false

[dependencies]
hexo-engine = { package = "mantis-hexo-engine", path = "../engine" }
hexo-runner = { package = "mantis-hexo-runner", path = "../runner" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
