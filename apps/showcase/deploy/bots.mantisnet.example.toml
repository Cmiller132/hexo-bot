# Example mantisnet entry for the production catalogue. Merge into
# deploy/models/bots.toml (checkpoint paths resolve relative to that file).
#
# The per-checkpoint `sims` ladder is deliberate: MantisNet's per-eval cost
# is roughly an order of magnitude above shrimp's, and its as-evaled anchor
# profile ran 32 sims — 16/32/64 brackets that. Without the override the
# entry would inherit the global 64-512 ladder.
#
# Threat-Space Search needs no key here: it is ON by default, per-game
# switchable from game setup, and every knob has a shipped default (leaf
# node_cap 500 with no leaf wall clock, root_node_cap 200000 /
# root_wall_budget_ms 15000, leaf_gate "threats", workers 3). Override them
# only by adding a `search_profile` toml with a `[tss]` table — the knobs and
# why the root cap is 40x the leaf cap are in apps/showcase/README.md,
# "Threat-Space Search". Unknown `[tss]` keys fail catalogue load.

[[checkpoint]]
id = "mantis-cellnodes1-it402"
family = "mantisnet"
checkpoint = "mantis_cellnodes1_it402_infer.pt"
label = "MantisNet cellnodes-1"
run = "cellnodes-1"
epoch = 402
params = 5196965
sims = [16, 32, 64]
group = "mantisnet"
featured = true
